name: Build DTDC EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Build Windows EXE
        run: |
          pyinstaller --onefile --windowed --name DTDC_Bill_Generator --add-data "assets;assets" --add-data "generator/templates;generator/templates" --hidden-import=weasyprint --hidden-import=barcode --hidden-import=fitz --hidden-import=PIL app_gui.py --clean -y
      
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: DTDC_Bill_Generator-Windows-EXE
          path: dist/DTDC_Bill_Generator.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
      
      - name: Build Linux Binary
        run: |
          pyinstaller --onefile --name DTDC_Bill_Generator --add-data "assets:assets" --add-data "generator/templates:generator/templates" --hidden-import=weasyprint --hidden-import=barcode --hidden-import=fitz --hidden-import=PIL app_gui.py --clean -y
      
      - name: Upload Linux Binary
        uses: actions/upload-artifact@v4
        with:
          name: DTDC_Bill_Generator-Linux-Binary
          path: dist/DTDC_Bill_Generator
